{% extends "base.html" %}

{% block content %}

<a href="/pacientes/create"
class="btn btn-primary mb-3">
nuevo paciente
</a>

<table class="table table-bordered">

    <thead class="table-dark">

        <tr>
            <th>nombre</th>
            <th>edad</th>
            <th>direccion</th>
            <th>telefono</th>
            <th>acciones</th>
        </tr>

    </thead>

    <tbody>

    {% for paciente in pacientes %}

        <tr>

            <td>{{ paciente.nombre }}</td>

            <td>{{ paciente.edad }}</td>

            <td>{{ paciente.direccion }}</td>

            <td>{{ paciente.telefono }}</td>

            <td>

                <a
                href="/pacientes/edit/{{ paciente.id }}"
                class="btn btn-warning btn-sm">
                editar
                </a>

                <a
                href="/pacientes/delete/{{ paciente.id }}"
                class="btn btn-danger btn-sm">
                eliminar
                </a>

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
